name: Rust Unit Tests


on: 
  push: 
    branches: [ main ]
  pull_request: 
    branches: [ main ]
  


jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Unit Tests
        run: cargo test --verbose
